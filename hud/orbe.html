<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>JARVIS_CORE_ORB_WIDGET</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010101 !important; /* Chave de transparência do Windows */
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #010101;
        }

        canvas {
            background-color: #010101 !important;
            display: block;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script src="orbe.js"></script>
</body>
</html>
